name: Public safety
on:
  push:
  pull_request:
jobs:
  public-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run audit:public
      - run: npm run audit:negative
      - run: npm test
